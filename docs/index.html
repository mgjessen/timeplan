<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Timeplan" />
    <meta name="application-name" content="Timeplan" />
    <meta name="theme-color" content="#a7dfc6" />
    <title>Timeplan</title>
    <link rel="manifest" href="manifest.json?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=6" />
    <link rel="shortcut icon" href="favicon.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=41" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="sticky-chrome" id="sticky-chrome">
        <div class="brand-bar">
          <h1 class="app-title">Timeplan</h1>
          <div class="geese-mark" aria-label="GEESE">
            <img
              class="geese-mark-icon"
              src="geese-mark.png?v=1"
              width="36"
              height="36"
              alt=""
            />
            <span class="geese-mark-label">GEESE</span>
          </div>
        </div>
        <nav class="person-tabs" id="person-tabs" aria-label="Velg klasse"></nav>
        <nav class="day-tabs" id="day-tabs" aria-label="Velg dag"></nav>
      </header>

      <main id="planer" class="main">
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="name-edit" id="name-edit" hidden>
          <div class="name-edit-row">
            <input
              type="text"
              id="name-input"
              class="subject-input"
              maxlength="60"
              placeholder="Klasse"
              aria-label="Klasse"
            />
            <button
              type="button"
              class="remove-slot class-icon-btn"
              id="btn-remove-class"
              aria-label="Fjern klasse"
            >
              ×
            </button>
            <button
              type="button"
              class="remove-slot class-icon-btn"
              id="btn-add-class"
              aria-label="Legg til klasse"
            >
              +
            </button>
          </div>
        </div>

        <section class="schedule-section" aria-label="Ukeplan">
          <div id="schedule-root" class="day-stack"></div>
        </section>

        <div class="action-bar" id="action-bar">
          <div class="toolbar-actions" id="view-actions">
            <button type="button" class="btn btn-edit" id="btn-edit">
              Rediger
            </button>
          </div>
          <div class="toolbar-actions edit-pair" id="edit-actions" hidden>
            <button type="button" class="btn btn-ghost" id="btn-cancel">
              Avbryt
            </button>
            <button type="button" class="btn btn-primary" id="btn-save">
              Lagre
            </button>
          </div>
          <div class="file-tools" id="file-tools" hidden>
            <button type="button" class="btn btn-ghost" id="btn-export">
              Eksporter
            </button>
            <button type="button" class="btn btn-ghost" id="btn-import">
              Importer
            </button>
            <input
              type="file"
              id="import-input"
              accept="application/json,.json"
              hidden
            />
          </div>
        </div>
      </main>
    </div>

    <script src="app.js?v=41"></script>
  </body>
</html>
