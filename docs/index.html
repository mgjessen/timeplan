<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Timeplan" />
    <meta name="application-name" content="Timeplan" />
    <meta name="theme-color" content="#ffffff" />
    <title>Timeplan</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="shortcut icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="sticky-chrome" id="sticky-chrome">
        <h1 class="app-title">Timeplan</h1>
        <nav class="person-tabs" id="person-tabs" aria-label="Velg klasse"></nav>
        <nav class="day-tabs" id="day-tabs" aria-label="Velg dag"></nav>
      </header>

      <main id="planer" class="main">
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <label class="name-edit" id="name-edit" hidden>
          <span>Klassenavn</span>
          <input type="text" id="name-input" maxlength="60" />
        </label>

        <div class="file-tools" id="file-tools" hidden>
          <button type="button" class="btn btn-ghost" id="btn-export">
            Eksporter
          </button>
          <button type="button" class="btn btn-ghost" id="btn-import">
            Last inn
          </button>
          <input
            type="file"
            id="import-input"
            accept="application/json,.json"
            hidden
          />
        </div>

        <section class="schedule-section" aria-label="Ukeplan">
          <div id="schedule-root" class="day-stack"></div>
        </section>
      </main>

      <div class="action-bar" id="action-bar">
        <div class="toolbar-actions" id="view-actions">
          <button type="button" class="btn btn-edit" id="btn-edit">Rediger</button>
        </div>
        <div class="toolbar-actions edit-pair" id="edit-actions" hidden>
          <button type="button" class="btn btn-ghost" id="btn-cancel">Avbryt</button>
          <button type="button" class="btn btn-primary" id="btn-save">Lagre</button>
        </div>
      </div>
    </div>

    <script src="app.js?v=11"></script>
  </body>
</html>
