<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#dceee6" />
    <title>Timeplan — Haumyrheia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="wash wash-a"></div>
      <div class="wash wash-b"></div>
      <div class="grain"></div>
    </div>

    <div class="phone-shell">
      <header class="hero">
        <p class="eyebrow reveal">
          Skoleåret <span id="school-year">2026/2027</span>
        </p>
        <h1 class="brand reveal delay-1">Timeplan</h1>
        <p class="lede reveal delay-2">
          Haumyrheia 8A og 10A — ukeplaner lagret på serveren.
        </p>
        <div class="hero-actions reveal delay-3">
          <a class="btn btn-primary" href="#planer">Se planene</a>
        </div>
      </header>

      <main id="planer" class="main">
        <nav class="person-tabs reveal delay-4" id="person-tabs" aria-label="Velg klasse">
          <!-- filled by app.js -->
        </nav>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <nav class="day-tabs" id="day-tabs" aria-label="Velg dag"></nav>

        <section class="schedule-section" aria-label="Ukeplan">
          <header class="person-head">
            <h2 id="schedule-title">Haumyrheia 8A</h2>
            <p id="schedule-sub">Fag, rom og lærer</p>
            <label class="name-edit" id="name-edit" hidden>
              <span>Klassenavn</span>
              <input type="text" id="name-input" maxlength="60" />
            </label>
          </header>
          <div id="schedule-root" class="day-stack"></div>
        </section>
      </main>

      <footer class="foot">
        <p>Lagret på serveren</p>
      </footer>

      <div class="action-bar" id="action-bar">
        <div class="toolbar-actions" id="view-actions">
          <button type="button" class="btn btn-edit" id="btn-edit">Rediger</button>
        </div>
        <div class="toolbar-actions edit-pair" id="edit-actions" hidden>
          <button type="button" class="btn btn-ghost" id="btn-cancel">Avbryt</button>
          <button type="button" class="btn btn-primary" id="btn-save">Lagre</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
